[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jittor-chief"
version = "0.1.0"
description = "Jittor reproduction of the CHIEF whole-slide pathology model"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["chief_jittor*"]
